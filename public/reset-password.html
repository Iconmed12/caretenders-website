<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set a new password | Cana Bids</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy:#0B1929; --teal:#00C9E0; --teal-dk:#0099AA; --white:#ffffff; --offwhite:#F4F6F9;
    --muted:#6B8FA3; --border:rgba(11,25,41,0.09); --error:#E53E3E; --success:#38A169;
  }
  body { font-family:'Inter',sans-serif; background:var(--offwhite); color:var(--navy); min-height:100vh; display:flex; flex-direction:column; }
  nav { background:var(--navy); padding:0 2rem; display:flex; align-items:center; justify-content:space-between; height:62px; }
  .nav-right { font-size:0.85rem; color:rgba(255,255,255,0.55); }
  .nav-right a { color:var(--teal); text-decoration:none; font-weight:500; }
  .page { flex:1; display:flex; align-items:center; justify-content:center; padding:3rem 1.5rem; }
  .auth-card { background:var(--white); border-radius:16px; border:1px solid var(--border); box-shadow:0 4px 32px rgba(11,25,41,0.07); width:100%; max-width:440px; padding:2.5rem; }
  .auth-card-header { text-align:center; margin-bottom:2rem; }
  .auth-badge { display:inline-flex; align-items:center; gap:7px; background:rgba(0,201,224,0.08); border:1px solid rgba(0,201,224,0.2); border-radius:999px; padding:5px 14px; font-size:0.74rem; color:var(--teal-dk); font-weight:600; letter-spacing:0.05em; text-transform:uppercase; margin-bottom:1rem; }
  .auth-card-header h1 { letter-spacing:-0.02em; font-size:1.75rem; color:var(--navy); margin-bottom:0.5rem; }
  .auth-card-header p { font-size:0.88rem; color:var(--muted); line-height:1.6; }
  .form-group { display:flex; flex-direction:column; gap:6px; margin-bottom:1.1rem; }
  .form-label { font-size:0.82rem; font-weight:600; color:var(--navy); }
  .form-input { padding:12px 14px; border:1.5px solid var(--border); border-radius:9px; font-size:0.95rem; font-family:'Inter',sans-serif; color:var(--navy); outline:none; transition:border-color 0.2s; background:var(--white); width:100%; }
  .form-input:focus { border-color:var(--teal); box-shadow:0 0 0 3px rgba(0,201,224,0.08); }
  .pw-wrap { position:relative; }
  .pw-wrap .form-input { padding-right:44px; }
  .pw-eye { position:absolute; top:0; right:0; height:100%; width:42px; display:flex; align-items:center; justify-content:center; background:none; border:0; cursor:pointer; color:var(--muted); font-size:0.75rem; font-weight:600; }
  .pw-eye:hover { color:var(--navy); }
  .alert { border-radius:9px; padding:12px 16px; font-size:0.87rem; margin-bottom:1.25rem; display:none; line-height:1.5; }
  .alert.show { display:block; }
  .alert-error { background:rgba(229,62,62,0.08); border:1px solid rgba(229,62,62,0.25); color:#c53030; }
  .alert-success { background:rgba(56,161,105,0.08); border:1px solid rgba(56,161,105,0.25); color:#276749; }
  .btn-primary { width:100%; background:var(--navy); color:var(--white); border:none; border-radius:10px; padding:14px 24px; font-size:0.95rem; font-weight:700; font-family:'Inter',sans-serif; cursor:pointer; transition:background 0.2s; margin-top:0.5rem; text-align:center; display:block; text-decoration:none; }
  .btn-primary:hover { background:#1a3550; }
  .btn-primary:disabled { opacity:0.6; cursor:not-allowed; }
  .auth-footer { text-align:center; margin-top:1.5rem; font-size:0.87rem; color:var(--muted); }
  .auth-footer a { color:var(--teal-dk); text-decoration:none; font-weight:500; }
  .hint { font-size:0.76rem; color:var(--muted); margin-top:-0.4rem; margin-bottom:1rem; }
</style>
</head>
<body>

<nav>
  <a href="/" style="display:inline-flex;align-items:center;gap:9px;line-height:1;text-decoration:none"><svg viewBox="0 0 64 64" style="height:42px;width:42px;flex:none" aria-hidden="true"><path d="M46 17 A22 22 0 1 0 46 47" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/><path d="M24 33 l6 6 L44 22" fill="none" stroke="#00C9E0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg><span style="font-family:'Inter',sans-serif;font-weight:700;font-size:1.5rem;letter-spacing:-0.02em;color:#fff">Cana<span style="color:#00C9E0;margin-left:0.3em">Bids</span></span></a>
  <div class="nav-right"><a href="/login.html">Back to sign in</a></div>
</nav>

<div class="page">
  <div class="auth-card">
    <div class="auth-card-header">
      <div class="auth-badge">Password reset</div>
      <h1>Set a new password</h1>
      <p id="subtitle">Choose a new password for your Cana Bids account.</p>
    </div>

    <div class="alert alert-error" id="err"></div>
    <div class="alert alert-success" id="ok"></div>

    <div id="formWrap">
      <div class="form-group">
        <label class="form-label" for="pw">New password</label>
        <div class="pw-wrap">
          <input class="form-input" type="password" id="pw" placeholder="At least 8 characters" autocomplete="new-password">
          <button class="pw-eye" type="button" id="eye1">Show</button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="pw2">Confirm new password</label>
        <div class="pw-wrap">
          <input class="form-input" type="password" id="pw2" placeholder="Re-enter your new password" autocomplete="new-password">
          <button class="pw-eye" type="button" id="eye2">Show</button>
        </div>
      </div>
      <button class="btn-primary" id="saveBtn">Update password</button>
    </div>

    <div id="invalidWrap" style="display:none">
      <a class="btn-primary" href="/login.html">Request a new reset link</a>
    </div>

    <div class="auth-footer"><a href="/login.html">Back to sign in</a></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  var SUPABASE_URL = 'https://igpjfpncfuawikoyzfcd.supabase.co';
  var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlncGpmcG5jZnVhd2lrb3l6ZmNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1OTE5NDEsImV4cCI6MjA5NjE2Nzk0MX0.7s3EEk5pJzwJm8jrY4c6XNN2hga2LB1AEWb_vsxNakA';
  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  var err = document.getElementById('err');
  var ok = document.getElementById('ok');
  var formWrap = document.getElementById('formWrap');
  var invalidWrap = document.getElementById('invalidWrap');
  var subtitle = document.getElementById('subtitle');
  var saveBtn = document.getElementById('saveBtn');
  var pw = document.getElementById('pw');
  var pw2 = document.getElementById('pw2');

  function showErr(m){ err.textContent = m; err.classList.add('show'); }
  function clearErr(){ err.classList.remove('show'); }

  function eye(btn, input){ btn.addEventListener('click', function(){ var t = input.type === 'password'; input.type = t ? 'text' : 'password'; btn.textContent = t ? 'Hide' : 'Show'; }); }
  eye(document.getElementById('eye1'), pw);
  eye(document.getElementById('eye2'), pw2);

  var ready = false;
  function markReady(){ ready = true; }

  // The recovery link puts a token in the URL; supabase-js turns it into a short
  // lived session and fires PASSWORD_RECOVERY. That is our cue the form is usable.
  sb.auth.onAuthStateChange(function(event, session){
    if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session)) markReady();
  });

  // Fallback: after the hash is processed, if there is no session the link was
  // invalid or has expired.
  (async function(){
    await new Promise(function(r){ setTimeout(r, 700); });
    try {
      var res = await sb.auth.getSession();
      if ((!res.data || !res.data.session) && !ready) {
        formWrap.style.display = 'none';
        subtitle.textContent = 'This reset link is invalid or has expired. Request a new one below.';
        invalidWrap.style.display = 'block';
      }
    } catch (e) { /* leave the form visible */ }
  })();

  saveBtn.addEventListener('click', async function(){
    clearErr();
    var p = pw.value, p2 = pw2.value;
    if (p.length < 8) { showErr('Your new password must be at least 8 characters.'); return; }
    if (p !== p2) { showErr('The two passwords do not match.'); return; }
    saveBtn.disabled = true; saveBtn.textContent = 'Updating...';
    try {
      var out = await sb.auth.updateUser({ password: p });
      if (out.error) { saveBtn.disabled = false; saveBtn.textContent = 'Update password'; showErr(out.error.message || 'Could not update your password. Please request a new reset link.'); return; }
      formWrap.style.display = 'none';
      ok.textContent = 'Password updated. Taking you to sign in...'; ok.classList.add('show');
      try { await sb.auth.signOut(); } catch (e) {}
      setTimeout(function(){ window.location.href = '/login.html'; }, 2200);
    } catch (e) {
      saveBtn.disabled = false; saveBtn.textContent = 'Update password';
      showErr('Something went wrong. Please request a new reset link.');
    }
  });
</script>
</body>
</html>
