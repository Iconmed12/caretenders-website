<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S.A.T (Send a Tender) | Cana Bids</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root { --navy:#0b1929; --navy2:#13253a; --teal:#00c9e0; --teal-dk:#0891a3; --ink:#1a2433; --muted:#63707f; --line:#e7ebf1; --soft:#f4f8fa; --good:#16a37b; --white:#fff; }
  body { font-family:'Plus Jakarta Sans',system-ui,Arial,sans-serif; background:var(--soft); color:var(--ink); min-height:100vh; line-height:1.5; }
  a { text-decoration:none; }
  .shell { display:grid; grid-template-columns:236px 1fr; min-height:100vh; }
  .side { background:var(--navy); color:#fff; padding:20px 16px; display:flex; flex-direction:column; gap:6px; position:sticky; top:0; height:100vh; }
  .logo { display:flex; align-items:center; gap:9px; font-weight:800; font-size:19px; letter-spacing:-.02em; padding:4px 8px 16px; color:#fff; }
  .logo b { color:var(--teal); }
  .nav a { display:flex; align-items:center; gap:11px; padding:11px 12px; border-radius:10px; color:rgba(255,255,255,.68); font-size:14px; font-weight:600; }
  .nav a .ic { width:18px; display:inline-block; text-align:center; }
  .nav a.on { background:rgba(255,255,255,.08); color:#fff; }
  .nav a:hover { color:#fff; }
  .side-foot { margin-top:auto; display:flex; flex-direction:column; gap:10px; }
  .org { background:var(--navy2); border:1px solid rgba(255,255,255,.08); border-radius:12px; padding:12px; }
  .org .n { display:flex; align-items:center; gap:9px; font-weight:700; font-size:14px; }
  .org .s { font-size:12px; color:rgba(255,255,255,.55); margin-top:3px; }
  .userchip { display:flex; align-items:center; gap:10px; padding:6px 4px; }
  .nav-avatar { width:34px; height:34px; background:var(--teal); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:800; color:var(--navy); flex-shrink:0; }
  .userchip .un { font-size:13px; font-weight:700; color:#fff; line-height:1.2; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nav-signout { font-size:12px; color:rgba(255,255,255,.5); background:none; border:none; cursor:pointer; font-family:inherit; text-align:left; padding:2px 4px; }
  .nav-signout:hover { color:#fff; }
  .main { padding:26px 30px; min-width:0; max-width:900px; }
  .top h1 { font-size:24px; font-weight:800; color:var(--navy); letter-spacing:-.02em; }
  .top p { font-size:13.5px; color:var(--muted); margin-top:4px; margin-bottom:22px; }
  #tr-card .tr-input{width:100%;padding:12px 14px;border:1.5px solid #dbe0e8;border-radius:10px;font-size:0.95rem;box-sizing:border-box;font-family:inherit;color:var(--navy);background:#fbfcfe;transition:border-color .15s,box-shadow .15s,background .15s;}
  #tr-card .tr-input::placeholder{color:#9aa3b2;}
  #tr-card .tr-input:hover{border-color:#c3cad6;}
  #tr-card .tr-input:focus{outline:none;border-color:#00C9E0;box-shadow:0 0 0 3px rgba(0,201,224,0.16);background:#fff;}
  #tr-send{background:#00C9E0;border:none;color:var(--navy);font-weight:700;padding:12px 24px;border-radius:10px;font-size:0.95rem;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:filter .15s;font-family:inherit;}
  #tr-send:hover{filter:brightness(0.94);}
  #tr-send:disabled{opacity:.6;cursor:default;}
  #loading-screen { position:fixed; inset:0; background:var(--soft); display:flex; align-items:center; justify-content:center; z-index:999; }
  .spinner { width:36px; height:36px; border:3px solid var(--line); border-top-color:var(--teal); border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (max-width:820px) {
    .shell { grid-template-columns:1fr; }
    .side { position:static; height:auto; flex-direction:column; gap:8px; padding:14px 16px; }
    .nav { display:flex; flex-wrap:wrap; gap:4px; }
    .nav a { padding:8px 12px; font-size:13px; }
    .side-foot { margin-top:8px; flex-direction:row; align-items:center; justify-content:space-between; }
    .org { display:none; }
    .main { padding:20px 16px; }
  }
</style>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0B1929">
</head>
<body>

<div id="loading-screen"><div class="spinner"></div></div>

<div class="shell" id="main-page" style="display:none;">
  <aside class="side">
    <a href="/" class="logo">Cana<b>Bids</b></a>
    <nav class="nav">
      <a href="/dashboard.html">Dashboard</a>
      <a href="/tenders.html">Opportunities</a>
      <a href="/sat.html" class="on">S.A.T</a>
      <a href="/profile.html">Company profile</a>
      <a href="/vault.html">Documents</a>
      <a href="/team.html">Team</a>
      <a href="/plans.html" id="nav-pricing">Pricing</a>
    </nav>
    <div class="side-foot">
      <div class="org" id="org-box" style="display:none">
        <div class="n"><span id="org-name">—</span></div>
        <div class="s" id="org-sub"></div>
      </div>
      <div class="userchip">
        <div class="nav-avatar" id="nav-avatar">?</div>
        <div style="min-width:0">
          <div class="un" id="nav-name">Loading...</div>
          <button class="nav-signout" onclick="handleSignOut()">Sign out</button>
        </div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="top">
      <h1>S.A.T · Send a Tender</h1>
      <p>Seen a tender elsewhere that is not on Cana? Send us the link and we will add it to your dashboard, then email you when it is ready to generate.</p>
    </div>

    <div id="tr-card" style="background:var(--white);border:1px solid var(--line);border-radius:14px;padding:22px 24px;">
      <div id="tr-form">
        <input id="tr-link" type="url" class="tr-input" placeholder="Paste the tender link" style="margin-bottom:12px;" />
        <textarea id="tr-note" class="tr-input" placeholder="Anything we should know? (optional)" style="min-height:74px;resize:vertical;margin-bottom:14px;"></textarea>
        <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
          <button id="tr-send" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Send it to us</button>
          <span id="tr-msg" style="font-size:0.86rem;"></span>
        </div>
      </div>
      <div id="tr-mine" style="margin-top:20px;"></div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://igpjfpncfuawikoyzfcd.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlncGpmcG5jZnVhd2lrb3l6ZmNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1OTE5NDEsImV4cCI6MjA5NjE2Nzk0MX0.7s3EEk5pJzwJm8jrY4c6XNN2hga2LB1AEWb_vsxNakA';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  async function handleSignOut() { await sb.auth.signOut(); window.location.href = '/'; }

  (async function init() {
    var { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = '/login.html?redirect=/sat.html'; return; }
    var user = session.user;
    if (String(user.email || '').toLowerCase().indexOf('getcana.co.uk') !== -1) { window.location.href = '/'; return; }
    var meta = user.user_metadata || {};
    document.getElementById('nav-avatar').textContent = ((meta.first_name||'?')[0] + (meta.last_name||'?')[0]).toUpperCase();
    document.getElementById('nav-name').textContent = (meta.first_name||'') + ' ' + (meta.last_name||'');

    // Enterprise (company circle) box, non-blocking.
    try {
      var eRes = await fetch('/.netlify/functions/enterprise', { headers: { Authorization: 'Bearer ' + session.access_token } });
      if (eRes.ok) {
        var eData = await eRes.json();
        if (eData && eData.role && eData.enterprise && eData.enterprise.name) {
          document.getElementById('org-name').textContent = eData.enterprise.name;
          document.getElementById('org-sub').textContent = eData.role === 'owner' ? 'Enterprise · owner' : ((eData.department ? eData.department + ' · ' : '') + 'member');
          document.getElementById('org-box').style.display = 'block';
        }
        if (eData && eData.role === 'member') {
          var np = document.getElementById('nav-pricing'); if (np) np.style.display = 'none';
        }
      }
    } catch (e) {}

    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('main-page').style.display = 'grid';
  })();
</script>
<script src="/tender-requests.js" defer></script>
</body>
</html>
