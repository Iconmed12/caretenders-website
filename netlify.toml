[build]
  publish = "public"
  functions = "netlify/functions"

[functions."stream-response"]
  timeout = 26

[functions."generate-cana"]
  timeout = 26

[functions."generate-response"]
  timeout = 26

[functions."extract-sq"]
  timeout = 26

[functions."generate-cana-background"]
  timeout = 900

[functions."import-tenders"]
  timeout = 300
  schedule = "0 6,14 * * *"

[functions."check-vault-expiry"]
  schedule = "0 9 * * *"

[functions."expire-tenders"]
  schedule = "0 1 * * *"

[functions."purge-rejected"]
  schedule = "0 2 * * *"
