[build]
  publish = "public"
  functions = "netlify/functions"

# Keep the raw netlify.app address from ever showing to visitors: send it to
# the brand domain. Function calls (Stripe webhooks, scheduled jobs) are left
# alone by the first rule so a redirect can never break a webhook POST.
[[redirects]]
  from = "https://caretenders-website.netlify.app/.netlify/*"
  to = "https://caretenders-website.netlify.app/.netlify/:splat"
  status = 200
  force = false

[[redirects]]
  from = "https://caretenders-website.netlify.app/*"
  to = "https://getcana.co.uk/:splat"
  status = 301
  force = true

# Security headers applied to every response. No Content-Security-Policy yet:
# the site uses inline scripts and onclick handlers, so a strict CSP would break
# it until those are refactored. These headers are all safe with the current site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[functions."stream-response"]
  timeout = 26

[functions."extract-sq"]
  timeout = 26

[functions."generate-cana-background"]
  timeout = 900

[functions."import-tenders"]
  timeout = 300
  schedule = "0 6,14 * * *"

[functions."check-vault-expiry"]
  schedule = "0 9 * * *"

[functions."expire-tenders"]
  schedule = "0 1 * * *"

[functions."purge-rejected"]
  schedule = "0 2 * * *"
